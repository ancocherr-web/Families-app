name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project skeleton
        run: flutter create --platforms=android --org com.families --project-name families_app .

      - name: Add location permissions
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ('<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
                   '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    ')
          if 'ACCESS_FINE_LOCATION' not in s:
              s = re.sub(r'(<manifest[^>]*>\s*)', lambda m: m.group(1) + '    ' + perms, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Set minSdk
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle* || true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: families-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
