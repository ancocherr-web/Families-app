name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project skeleton
        run: flutter create --platforms=android --org com.families --project-name families_app .

      - name: Add permissions and set minSdk
        run: |
          python3 - << 'PY'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'ACCESS_FINE_LOCATION' not in s:
              perms = ('<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
                       '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    ')
              s = re.sub(r'(<manifest[^>]*>\s*)', lambda m: m.group(1) + '    ' + perms, s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 21', t)
              t = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', t)
              open(g, 'w', encoding='utf-8').write(t)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: families-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
